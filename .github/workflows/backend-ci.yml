name: Backend CI & Deploy Safety

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  django-tests:
    name: Django Test Suite (Dev / SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django Tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: test-ci-django-dev-secret-key-32chars
        run: |
          python manage.py test

  postgres-migrations:
    name: Postgres 16 Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Clean Migrations on Postgres 16
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.base
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/testdb
          DATABASE_SSL_REQUIRE: 'false'
          SECRET_KEY: test-ci-clean-migrations-secret-key-32chars
        run: |
          python manage.py migrate --noinput
          python manage.py check

  docker-build:
    name: Docker Build & Static Collection Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t adepteduverse-backend-test backend

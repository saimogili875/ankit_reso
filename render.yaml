services:
  # 1. Django 4.2 REST API Web Service
  - type: web
    name: ankit-reso-api
    runtime: python
    region: oregon
    plan: standard
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CONN_MAX_AGE
        value: "600"
      - key: DISABLE_SERVER_SIDE_CURSORS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ankit-reso-redis
          property: connectionString
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "adepteduverse-storage"
      - key: R2_ENDPOINT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: "production"

  # 2. Celery Worker (Async Test Analysis, Notifications, Background Jobs)
  - type: worker
    name: ankit-reso-celery-worker
    runtime: python
    region: oregon
    plan: standard
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A config worker -l info --concurrency 4"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: DATABASE_URL
      - key: CONN_MAX_AGE
        value: "600"
      - key: DISABLE_SERVER_SIDE_CURSORS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ankit-reso-redis
          property: connectionString
      - key: LIVEKIT_URL
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: LIVEKIT_URL
      - key: LIVEKIT_API_KEY
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: LIVEKIT_API_KEY
      - key: LIVEKIT_API_SECRET
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: LIVEKIT_API_SECRET
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET_NAME
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: R2_BUCKET_NAME
      - key: R2_ENDPOINT
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: R2_ENDPOINT
      - key: SENTRY_DSN
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: SENTRY_DSN

  # 3. Celery Beat (15-min Live Reminders & Abandoned Room Cleaner)
  - type: worker
    name: ankit-reso-celery-beat
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A config beat -l info"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: redis
          name: ankit-reso-redis
          property: connectionString
      - key: LIVEKIT_URL
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: LIVEKIT_URL
      - key: LIVEKIT_API_KEY
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: LIVEKIT_API_KEY
      - key: LIVEKIT_API_SECRET
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: LIVEKIT_API_SECRET
      - key: SENTRY_DSN
        fromService:
          type: web
          name: ankit-reso-api
          envVarKey: SENTRY_DSN

  # 4. Managed Redis (Cache & Celery Broker)
  - type: redis
    name: ankit-reso-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

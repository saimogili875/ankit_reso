services:
  # 1. Django 4.2 REST API Web Service
  - type: web
    name: ankit-reso
    runtime: python
    region: oregon
    plan: standard
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py ensure_admin"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: SECRET_KEY
        generateValue: true
      - key: VIDEO_STREAMING_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: "ankit-reso.onrender.com"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Note: The app reads DATABASE_URL first (recommended for Supabase / Neon pooled connections).
      # Individual POSTGRES_* parameters are only a fallback if DATABASE_URL is unset. Prefer DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: PREVIEW_ORIGINS_ENABLED
        value: "false"
      - key: CONN_MAX_AGE
        value: "600"
      - key: DISABLE_SERVER_SIDE_CURSORS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ankit-reso-redis
          property: connectionString
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: R2_BUCKET_NAME
        value: "adepteduverse-storage"
      - key: R2_ENDPOINT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VIDEO_STREAMING_DOMAIN
        sync: false
      - key: ENABLE_1080P
        value: "false"
      - key: ENVIRONMENT
        value: "production"

  # 2. Celery Worker (Async Test Analysis, Notifications, Background Jobs)
  - type: worker
    name: ankit-reso-celery-worker
    runtime: python
    region: oregon
    plan: standard
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A config worker -Q celery,default -l info --concurrency 4"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ankit-reso
          envVarKey: SECRET_KEY
      - key: VIDEO_STREAMING_SECRET
        fromService:
          type: web
          name: ankit-reso
          envVarKey: VIDEO_STREAMING_SECRET
      - key: DATABASE_URL
        fromService:
          type: web
          name: ankit-reso
          envVarKey: DATABASE_URL
      - key: CONN_MAX_AGE
        value: "600"
      - key: DISABLE_SERVER_SIDE_CURSORS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ankit-reso-redis
          property: connectionString
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET_NAME
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_BUCKET_NAME
      - key: R2_ENDPOINT
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_ENDPOINT
      - key: SENTRY_DSN
        fromService:
          type: web
          name: ankit-reso
          envVarKey: SENTRY_DSN
      - key: ENVIRONMENT
        value: "production"

  # 3. Dedicated Celery Video Transcoding Worker (FFmpeg HLS Pipeline)
  - type: worker
    name: ankit-reso-celery-video-worker
    runtime: python
    region: oregon
    plan: standard
    buildCommand: "./scripts/install_ffmpeg.sh && cd backend && pip install -r requirements.txt"
    startCommand: "export PATH=$HOME/bin:$PATH && cd backend && celery -A config worker -Q video -l info --concurrency 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ankit-reso
          envVarKey: SECRET_KEY
      - key: VIDEO_STREAMING_SECRET
        fromService:
          type: web
          name: ankit-reso
          envVarKey: VIDEO_STREAMING_SECRET
      - key: DATABASE_URL
        fromService:
          type: web
          name: ankit-reso
          envVarKey: DATABASE_URL
      - key: CONN_MAX_AGE
        value: "600"
      - key: DISABLE_SERVER_SIDE_CURSORS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ankit-reso-redis
          property: connectionString
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET_NAME
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_BUCKET_NAME
      - key: R2_ENDPOINT
        fromService:
          type: web
          name: ankit-reso
          envVarKey: R2_ENDPOINT
      - key: VIDEO_STREAMING_DOMAIN
        fromService:
          type: web
          name: ankit-reso
          envVarKey: VIDEO_STREAMING_DOMAIN
      - key: ENABLE_1080P
        fromService:
          type: web
          name: ankit-reso
          envVarKey: ENABLE_1080P
      - key: SENTRY_DSN
        fromService:
          type: web
          name: ankit-reso
          envVarKey: SENTRY_DSN
      - key: ENVIRONMENT
        value: "production"

  # 4. Celery Beat (Periodic Maintenance & Abandoned Video Cleaners)
  - type: worker
    name: ankit-reso-celery-beat
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A config beat -l info"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ankit-reso
          envVarKey: SECRET_KEY
      - key: VIDEO_STREAMING_SECRET
        fromService:
          type: web
          name: ankit-reso
          envVarKey: VIDEO_STREAMING_SECRET
      - key: DATABASE_URL
        fromService:
          type: web
          name: ankit-reso
          envVarKey: DATABASE_URL
      - key: CONN_MAX_AGE
        value: "600"
      - key: DISABLE_SERVER_SIDE_CURSORS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ankit-reso-redis
          property: connectionString
      - key: SENTRY_DSN
        fromService:
          type: web
          name: ankit-reso
          envVarKey: SENTRY_DSN
      - key: ENVIRONMENT
        value: "production"

  # 5. Managed Redis (Cache & Celery Broker)
  - type: redis
    name: ankit-reso-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
